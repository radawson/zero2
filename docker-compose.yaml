services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: zero-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Pin the data directory so Postgres major upgrades don't silently change
      # defaults and break existing volume mounts (see: https://github.com/activepieces/activepieces/issues/9568)
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    restart: always
    # Enable verbose logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero"]
      interval: 10s
      timeout: 5s
      retries: 5

